<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="https://www.nps.gov/favicon.ico" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>MapLibre GL Basemaps Control</title>

  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.js"></script>

  <link href="lib/basemaps.css" rel="stylesheet">
  <script src="lib/index.js"></script>

  <style>
    html,
    body,
    #Map {
      height: 100%;
      width: 100%;
      padding: 0;
      margin: 0;
    }
  </style>
  <script>
    window.addEventListener("load", function () {
      const map = new maplibregl.Map({
        container: "Map",
        hash: true,
        attributionControl: false,
        style: "https://DOI-NPS.github.io/npmap-style/standard.json",
        zoom: 6,
        center: [-88.648, 47.822]
      });
      map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");
      map.addControl(
        new MaplibreGLBasemapsControl(
          {
            basemaps: [ {}],
            initialBasemap: "OpenStreetMap",
            expandDirection: "top"
          }),
        "top-left"
      );
    });
  </script>
</head>

<body>

  <div id="Map"></div>
</body>

</html>
